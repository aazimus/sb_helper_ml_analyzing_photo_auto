services:
  db:
    image: postgres:15-alpine
    container_name: pg_car_check
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-car_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-car_password_123}
      POSTGRES_DB: ${DB_NAME:-car_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-car_user} -d ${DB_NAME:-car_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_number_check_backend
    restart: unless-stopped
    volumes:
      - media_data:/app/backend/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: cheking_number_car.settings
      PYTHONUNBUFFERED: 1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-car_db}
      DB_USER: ${DB_USER:-car_user}
      DB_PASSWORD: ${DB_PASSWORD:-car_password_123}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: car_number_check_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: car_number_check_worker
    restart: unless-stopped
    volumes:
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: cheking_number_car.settings
      PYTHONUNBUFFERED: 1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-car_db}
      DB_USER: ${DB_USER:-car_user}
      DB_PASSWORD: ${DB_PASSWORD:-car_password_123}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "True"
    env_file:
      - .env

volumes:
  pg_data:
  media_data:
