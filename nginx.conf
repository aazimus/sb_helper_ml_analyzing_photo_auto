events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;

    # Автоматический перенаправление с HTTP на HTTPS
    server {
        listen 80;
        server_name xyuoiu09hpvgigwhgvgwervgbohbohboye.ru;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной защищенный сервер HTTPS
    server {
        listen 443 ssl;
        server_name xyuoiu09hpvgigwhgvgwervgbohbohboye.ru;

        ssl_certificate /etc/letsencrypt/live/xyuoiu09hpvgigwhgvgwervgbohbohboye.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xyuoiu09hpvgigwhgvgwervgbohbohboye.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/ {
            proxy_pass http://car_number_check_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://car_number_check_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /static/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            alias /app/backend/media/;
            expires 30d;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
